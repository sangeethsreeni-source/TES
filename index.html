<title>TES Claim</title>
<style>
:root{
  --blue:#0B3C7A; --blue2:#1D5BB0; --blueTint:#E8F0FB; --red:#D52B1E;
  --ink:#16202E; --ink2:#55606F; --line:#DCE2EA; --bg:#F3F5F8; --card:#FFFFFF;
  --ok:#1B7A3A; --okTint:#E5F4EA; --warn:#A35A00; --warnTint:#FFF3E0; --bad:#B3261E; --badTint:#FDECEA;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#E8EDF4; --ink2:#9AA6B6; --line:#2A3443; --bg:#0F1620; --card:#18212D; --blueTint:#1A2B44;
    --okTint:#163323; --warnTint:#3A2A12; --badTint:#3A1B19; --blue2:#6EA2EA; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;min-height:56px}
.bar h1{font-size:18px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.bar .sub{display:block;font-size:12.5px;opacity:.8;font-weight:400}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.28)}

.wrap{padding:14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
h2{font-size:15px;margin:18px 4px 8px;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2);font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}

/* FY + quarter */
.fy{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:6px}
.fy b{font-size:17px}
.fy button{border:0;background:var(--blueTint);color:var(--blue2);width:44px;height:40px;border-radius:10px;font-size:20px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--blue);color:#fff}
.seg small{display:block;font-weight:400;font-size:11px;opacity:.8}

.kmbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.kmbar i{display:block;height:100%;background:var(--blue2);border-radius:6px}
.kmbar i.hi{background:var(--red)}

.month{margin-bottom:6px}
.fns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fn{border:0;text-align:left;background:var(--card);border-radius:var(--r);padding:12px;min-height:96px;position:relative;box-shadow:0 1px 0 var(--line)}
.fn .t{font-weight:700;font-size:16px}
.fn .d{font-size:12.5px;color:var(--ink2)}
.fn .st{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--line);color:var(--ink2)}
.fn.empty{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.fn.empty .st{background:none;padding-left:0}
.fn .prog{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.fn .prog i{display:block;height:100%;background:var(--blue2)}
.st.s0{background:var(--warnTint);color:var(--warn)} .st.s1,.st.s2{background:var(--blueTint);color:var(--blue2)}
.st.s3,.st.s4{background:#EDE7F6;color:#5E35B1} .st.s5{background:var(--okTint);color:var(--ok)} .st.sb{background:var(--badTint);color:var(--bad)}
@media (prefers-color-scheme: dark){ .st.s3,.st.s4{background:#2A2142;color:#B9A2F0} }

/* bottom action */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .dk{max-width:532px;margin:0 auto;display:flex;gap:8px}
.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:650;font-size:16px;background:var(--blue);color:#fff;flex:1;min-height:52px}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn.alt{background:var(--card);color:var(--blue2);box-shadow:inset 0 0 0 1.5px var(--blue2)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45}
.btn:active{filter:brightness(.92)}
.lnk{border:0;background:none;color:var(--blue2);font-weight:600;padding:8px 4px}

/* fortnight */
.steps{display:flex;gap:4px;margin:6px 0 10px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--blue2)}
.days{background:var(--card);border-radius:var(--r);overflow:hidden}
.day{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.day:last-child{border-bottom:0}
.day .dt{width:46px;text-align:center;flex:none}
.day .dt b{display:block;font-size:20px;line-height:1}
.day .dt span{font-size:11.5px;color:var(--ink2);text-transform:uppercase}
.day .info{flex:1;min-width:0}
.day .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .info .m{font-size:13px;color:var(--ink2)}
.day.sun .dt{opacity:.5}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--line)}
.dot.ti{background:#F2B233} .dot.ok{background:var(--ok)} .dot.lv{background:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:8px 4px}
.legend span{display:flex;align-items:center;gap:5px}

/* form */
.f{margin-bottom:14px}
.f>label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px 2px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:12px;font-size:16px;min-height:48px}
.in:focus{outline:none;border-color:var(--blue2)}
textarea.in{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:9px 14px;font-size:15px;min-height:42px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.add{border-style:dashed;color:var(--blue2)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3 button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 6px;font-weight:650;font-size:15px}
.big3 button span{display:block;font-size:24px;margin-bottom:4px}
.big3 button.on{border-color:var(--blue);background:var(--blueTint);color:var(--blue2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec>h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.sec>h3 .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--blueTint);color:var(--blue2)}
.calc{background:var(--blueTint);border-radius:11px;padding:10px 12px;font-size:14.5px;color:var(--blue2);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.sw{width:52px;height:32px;border-radius:20px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:23px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{width:72px;height:72px;border-radius:10px;background:var(--line) center/cover;position:relative}
.thumbs div button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:14px;line-height:1}
.warnbox{background:var(--warnTint);color:var(--warn);border-radius:11px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.okbox{background:var(--okTint);color:var(--ok);border-radius:11px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .hd{display:flex;align-items:center;padding:14px 16px 8px;gap:8px}
.sheet .hd b{flex:1;font-size:17px}
.sheet .bd{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.list button{display:block;width:100%;text-align:left;border:0;background:var(--card);padding:13px 14px;border-bottom:1px solid var(--line);font-size:15.5px}
.list button:first-child{border-radius:12px 12px 0 0} .list button:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.list button small{color:var(--ink2);margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* summary */
.sumt{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
.sumt th,.sumt td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.sumt th{background:var(--blueTint);color:var(--blue2)}
.sumt td.n{text-align:right;white-space:nowrap}
.sumt{min-width:640px}.sumt td.nw{white-space:nowrap}
.card .sumt{min-width:0}
.tw{overflow-x:auto;border-radius:10px}
@media print{
  .bar,.dock,.noprint{display:none!important}
  body,#app{background:#fff;color:#000}
  #app{max-width:none;padding:0}
  .sumt{min-width:0!important;font-size:10.5px}
  .card,.sec{box-shadow:none;border:1px solid #ccc}
  .sumt th{background:#eee;color:#000}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

/* ---------- dates (all local, as YYYY-MM-DD strings) ---------- */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

function lastDay(y, m) { return new Date(y, m, 0).getDate(); } // m = 1..12
function fnId(y, m, h) { return y + '-' + pad(m) + '-F' + h; }
function fnOf(dateStr) { var d = parse(dateStr); return fnId(d.getFullYear(), d.getMonth() + 1, d.getDate() <= 15 ? 1 : 2); }
function fnInfo(id) {
  var y = +id.slice(0, 4), m = +id.slice(5, 7), h = +id.slice(9, 10);
  var a = h === 1 ? 1 : 16, b = h === 1 ? 15 : lastDay(y, m);
  var start = y + '-' + pad(m) + '-' + pad(a), end = y + '-' + pad(m) + '-' + pad(b);
  var dates = []; for (var i = a; i <= b; i++) dates.push(y + '-' + pad(m) + '-' + pad(i));
  return { id: id, y: y, m: m, h: h, start: start, end: end, dates: dates,
    label: MONTHS[m - 1] + ' ' + y + ' · F' + h, range: pad(a) + '–' + pad(b) + ' ' + MONTHS[m - 1] };
}
function nextFn(id) { var i = fnInfo(id); if (i.h === 1) return fnId(i.y, i.m, 2); return i.m === 12 ? fnId(i.y + 1, 1, 1) : fnId(i.y, i.m + 1, 1); }

  var map = { 1: [4, 5, 6], 2: [7, 8, 9], 3: [10, 11, 12], 4: [1, 2, 3] };
  return map[q].map(function (m) { return [q === 4 ? fy + 1 : fy, m]; });
}

/* ---------- portal lookups ---------- */
function placeId(name) { var p = PORTAL.places.find(function (x) { return x[1] === name; }); return p ? p[0] : ''; }

/* ---------- fortnight data ---------- */
function getFn(id, create) {
  if (!DB.fns[id] && create) { DB.fns[id] = { id: id, status: 0, sentBack: false, days: {}, hotels: [], created: today() }; save(); }
  return DB.fns[id];
}
function dayOf(fn, date) { return fn.days[date]; }
function isTiDay(d) { return d && (d.type === 'hq' || d.type === 'field') && d.place; }
function kmOf(d) {
  if (!d || d.mode !== 'Own Car') return 0;
  var o = parseFloat(d.open), c = parseFloat(d.close), p = parseFloat(d.personal) || 0;
  if (isNaN(o) || isNaN(c) || c < o) return 0;
  return Math.max(0, c - o - p);
}
function expIssues(d) {
  var x = [];
  if (!d.from || !d.to) x.push('times');

  if (!d.mode) x.push('travel mode');

    var o = parseFloat(d.open), c = parseFloat(d.close);

}

}

  inf.dates.forEach(function (dt) {
    var d = fn.days[dt]; if (d && d.type) filled++;

  });

}

  var best = null, bestDate = '';
  Object.keys(DB.fns).forEach(function (id) {
    var days = DB.fns[id].days;
    Object.keys(days).forEach(function (dt) {

}

  });
  return km;
}

/* "+ New fortnight": earliest pending (TI not yet submitted), else the next one */
function nextAction() {
  var ids = Object.keys(DB.fns).sort();
  var pending = ids.filter(function (id) { var f = DB.fns[id]; return f.status < 2 || f.sentBack; });
  if (pending.length) return { id: pending[0], pending: true };
  var cur = fnOf(today());
  if (!ids.length) return { id: cur, pending: false, isNew: true };
  return { id: nextFn(ids[ids.length - 1]), pending: false, isNew: true };
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return (Math.round((+n || 0) * 100) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(n) { return (Math.round(+n || 0)).toLocaleString('en-IN'); }

function shareFile(blob, name) {

  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: name }).catch(function (e) { if (e && e.name !== 'AbortError') dl(blob, name); });
  }

}

    ws['!cols'] = s.widths.map(function (w) { return { wch: w }; });
    XLSX.utils.book_append_sheet(wb, ws, s.name);

  var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

}

  var name = 'TI_' + inf.y + '-' + pad(inf.m) + '_F' + inf.h + '.xlsx';

  }
  var issues = [];
  inf.dates.forEach(function (dt) { var d = fn.days[dt]; if (isTiDay(d)) { var x = expIssues(d); if (x.length) issues.push(dmy(dt).slice(0, 5) + ': ' + x.join(', ')); } });
  if (issues.length && !force) {
    sheet('Some days are incomplete', '<div class="warnbox">' + issues.map(esc).join('<br>') + '</div><div class="g2"><button class="btn alt" data-close="1">Fix first</button><button class="btn" id="anyway">Download anyway</button></div>',
      function () { $('anyway').onclick = function () { closeSheet(); exportTES(true); }; });
    return;
  }
  var rows = [['Date', 'Place of Visit', 'Purpose of Visit', 'From time', 'To time', 'Travel Mode', 'City', 'City code', 'Opening km', 'Closing km', 'Personal km', 'Km claimed (est.)', 'Canteen', 'Other amount', 'Invoice fare', 'Toll', 'Particulars / Ticket no.', 'Expense remark']];
  inf.dates.forEach(function (dt) {
    var d = fn.days[dt]; if (!isTiDay(d)) return;
    var car = d.mode === 'Own Car';
    rows.push([dmy(dt), d.place, d.purpose || '', d.from || '', d.to || '', d.mode || '', d.city || '', CITY_CODE[d.city] || '',
      car ? nz(d.open) : 0, car ? nz(d.close) : 0, car ? nz(d.personal) : 0, kmOf(d), d.canteen || 'No', nz(d.other), car ? 0 : nz(d.fare), nz(d.toll), d.ticket || '', d.expRemark || '']);
  });
  var hrows = [['From date', 'To date', 'No. of days', 'City', 'City code', 'Hotel name', 'Invoice no.', 'Invoice date', 'Amount without GST', 'GST no.', 'CGST', 'SGST', 'Remarks']];
  fn.hotels.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; }).forEach(function (x) {
    var g = nz(x.gst);
    hrows.push([dmy(x.from), x.to ? dmy(x.to) : '', hotelDays(x), x.city, CITY_CODE[x.city] || '', x.hotel, x.invNo, x.invDate ? dmy(x.invDate) : '', nz(x.amount), x.gstNo, Math.round(g / 2 * 100) / 100, Math.round(g / 2 * 100) / 100, x.remarks]);
  });
  var name = 'TES_' + inf.y + '-' + pad(inf.m) + '_F' + inf.h + '.xlsx';
  shareFile(wbBlob([{ name: 'TES', rows: rows, widths: [12, 24, 22, 9, 9, 11, 16, 10, 11, 11, 10, 10, 9, 11, 11, 9, 22, 26] },
    { name: 'Hotel', rows: hrows, widths: [12, 12, 9, 16, 10, 24, 14, 12, 14, 18, 10, 10, 22] }]), name).then(function () {
    if (fn.status < 4) { fn.status = 4; save(); render(); }
  });
}

/* ---------- receipt photos (IndexedDB) ---------- */
var idb;
function photoDB() {
  return new Promise(function (res, rej) {
    if (idb) return res(idb);
    var r = indexedDB.open('tesPhotos', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('p', { keyPath: 'id' }); };
    r.onsuccess = function () { idb = r.result; res(idb); }; r.onerror = function () { rej(r.error); };
  });
}
function photosFor(prefix) {
  return photoDB().then(function (db) {
    return new Promise(function (res) {
      var out = [], tx = db.transaction('p').objectStore('p').openCursor();
      tx.onsuccess = function (e) { var c = e.target.result; if (c) { if (c.value.id.indexOf(prefix) === 0) out.push(c.value); c.continue(); } else res(out); };
    });
  }).catch(function () { return []; });
}
function addPhoto(file) {
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var m = 1600, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) {
      photoDB().then(function (db) {
        var tx = db.transaction('p', 'readwrite'); tx.objectStore('p').put({ id: view.date + '_' + Date.now(), blob: b });
        tx.oncomplete = function () { toast('Photo saved'); showThumbs(); };
      });
    }, 'image/jpeg', 0.72);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
function showThumbs() {
  var el = $('thumbs'); if (!el) return;
  photosFor(view.date + '_').then(function (ps) {
    el.innerHTML = ps.map(function (p) { return '<div style="background-image:url(' + URL.createObjectURL(p.blob) + ')"><button data-delphoto="' + p.id + '" aria-label="Delete photo">×</button></div>'; }).join('');
  });
}
function delPhoto(id) { photoDB().then(function (db) { var tx = db.transaction('p', 'readwrite'); tx.objectStore('p').delete(id); tx.oncomplete = showThumbs; }); }
function shareReceipts() {
  var inf = fnInfo(view.id);
  photosFor(inf.y + '-' + pad(inf.m) + '-').then(function (ps) {
    ps = ps.filter(function (p) { var dt = p.id.slice(0, 10); return dt >= inf.start && dt <= inf.end; });
    if (!ps.length) { toast('No receipt photos in this fortnight'); return; }
    var cnt = {}, files = ps.map(function (p) { var dt = p.id.slice(0, 10); cnt[dt] = (cnt[dt] || 0) + 1; return new File([p.blob], 'Receipt_' + dmy(dt) + '_' + cnt[dt] + '.jpg', { type: 'image/jpeg' }); });
    if (navigator.canShare && navigator.canShare({ files: files })) navigator.share({ files: files, title: 'Receipts ' + inf.label }).catch(function () {});
    else files.forEach(function (f) { dl(f, f.name); });
  });
}

/* ---------- events ---------- */
function bind() {
  if (view.name === 'day') {
    updateCalc(); showThumbs();
    var pi = $('photoIn'); if (pi) pi.onchange = function () { if (pi.files[0]) addPhoto(pi.files[0]); pi.value = ''; };
  }
  var ri = $('restoreIn');
  if (ri) ri.onchange = function () {
    var f = ri.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () {
      try { var o = JSON.parse(rd.result); if (!o.settings || !o.fns) throw 0;
        if (!confirm('Replace all data on this phone with this backup (' + Object.keys(o.fns).length + ' fortnights)?')) return;
        localStorage.setItem(KEY, JSON.stringify(o)); load(); render(); toast('Backup restored');
      } catch (e) { toast('Not a TES Claim backup file'); }
    };
    rd.readAsText(f);
  };
}
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.k && view.name === 'day') {
    var d = curDay(true); d[t.dataset.k] = t.value;
    if (t.dataset.k === 'remark') d.remarkEdited = true;
    if (t.dataset.k === 'close' || t.dataset.k === 'open') { /* nothing extra */ }
    save(); updateCalc();
  }
  if (t.dataset.s && view.name === 'settings') {
    var k = t.dataset.s, v = t.value;
    S()[k] = (k === 'rate' || k === 'approvedKm') ? (parseFloat(v) || 0) : v; save();
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('button,[data-fn],[data-day]'); if (!b || b.closest('#scrim')) return;
  var ds = b.dataset;
  if (ds.go) { go({ name: ds.go }); return; }
  if (ds.fy) { go({ fy: view.fy + (+ds.fy) }); return; }
  if (ds.q) { go({ q: +ds.q }); return; }
  if (ds.fn) { getFn(ds.fn, true); go({ name: 'fn', id: ds.fn }); return; }
  if (ds.next) { getFn(ds.next, true); go({ name: 'fn', id: ds.next }); return; }
  if (ds.day) { go({ name: 'day', date: ds.day }); return; }
  if (ds.backFn) { cleanupDay(); go({ name: 'fn' }); return; }
  if (ds.daynav) { cleanupDay(); var inf = fnInfo(view.id), i = inf.dates.indexOf(view.date) + (+ds.daynav); if (inf.dates[i]) go({ date: inf.dates[i] }); return; }
  if (ds.setstatus) { var fn = getFn(view.id, true); fn.status = +ds.setstatus; save(); render(); toast(STATUS[fn.status]); return; }
  if (ds.type) { setType(ds.type); return; }
  if (ds.purpose) { var d = curDay(true); d.purpose = ds.purpose; refreshRemark(d); save(); render(); return; }
  if (ds.mode) { var d2 = curDay(true); d2.mode = ds.mode; if (ds.mode === 'Own Car' && (d2.open === undefined || d2.open === '')) { var pc = prevClosing(view.date); if (pc !== null) d2.open = pc; } save(); render(); return; }
  if (ds.city) { var d3 = curDay(true); d3.city = ds.city; d3.cityAuto = false; refreshRemark(d3); save(); render(); return; }
  if (ds.dist) { var d4 = curDay(true); d4.dists = (d4.dists || []).filter(function (x) { return x !== ds.dist; }); refreshRemark(d4); save(); render(); return; }
  if (ds.hotel) { var fh = getFn(view.id, true); hotelForm(fh.hotels.find(function (x) { return x.id === ds.hotel; })); return; }
  if (ds.defmode) { S().defMode = ds.defmode; save(); render(); return; }
  if (ds.delcity) { if (confirm('Remove ' + ds.delcity + ' from My cities?')) { S().myCities = S().myCities.filter(function (c) { return c !== ds.delcity; }); save(); render(); } return; }
  if (ds.editdist) { distForm(S().distributors.find(function (x) { return x.id === ds.editdist; })); return; }
  if (ds.pick === 'place') { pickList('Place of visit', PORTAL.places.map(function (p) { return { v: p[1], t: p[1] }; }), function (v) { var d = curDay(true); d.place = v; if (purposesFor(v).every(function (p) { return p[1] !== d.purpose; })) d.purpose = ''; refreshRemark(d); save(); render(); }); return; }
  if (ds.pick === 'city') { citySearch('City', function (c) { var d = curDay(true); d.city = c; d.cityAuto = false; refreshRemark(d); save(); render(); }); return; }
  if (ds.pick === 'dist') { distPicker(); return; }
  if (ds.pick === 'hqcity') { citySearch('HQ city', function (c) { S().hqCity = c; save(); render(); }); return; }
  if (ds.pick === 'addcity') { citySearch('Add to My cities', function (c) { if (S().myCities.indexOf(c) < 0) S().myCities.push(c); save(); render(); }); return; }
  var a = ds.act;
  if (a === 'status') { statusSheet(getFn(view.id, true)); }
  else if (a === 'unsendback') { var f2 = getFn(view.id, true); f2.sentBack = false; f2.status = 2; save(); render(); }
  else if (a === 'dlti') exportTI();
  else if (a === 'dltes') exportTES();
  else if (a === 'print') window.print();
  else if (a === 'canteen') { var d5 = curDay(true); d5.canteen = d5.canteen === 'Yes' ? 'No' : 'Yes'; save(); render(); }
  else if (a === 'autoremark') { var d6 = curDay(true); d6.remarkEdited = false; refreshRemark(d6); save(); render(); }
  else if (a === 'copyprev') {
    var inf2 = fnInfo(view.id), p = getFn(view.id).days[inf2.dates[inf2.dates.indexOf(view.date) - 1]];
    var c = JSON.parse(JSON.stringify(p)); c.open = p.mode === 'Own Car' ? p.close : ''; c.close = ''; c.personal = ''; c.toll = ''; c.other = ''; c.fare = ''; c.ticket = ''; c.expRemark = '';
    getFn(view.id).days[view.date] = c; save(); render(); toast('Copied. Update the km.');
  }
  else if (a === 'addhotel') hotelForm(null, view.date);
  else if (a === 'receipts') shareReceipts();
  else if (a === 'newdist') { distReturn = null; distForm(null); }
  else if (a === 'pastedist') pasteDist();
  else if (a === 'backup') { shareFile(new Blob([JSON.stringify(DB)], { type: 'application/json' }), 'TES_backup_' + today() + '.json').then(function () { toast('Backup ready'); }); }
  else if (a === 'delfn') { if (confirm('Delete all entries for ' + fnInfo(view.id).label + '?')) { delete DB.fns[view.id]; save(); go({ name: 'home' }); } }
});
document.addEventListener('click', function (e) { var b = e.target.closest('[data-delphoto]'); if (b) { e.stopPropagation(); if (confirm('Delete this photo?')) delPhoto(b.dataset.delphoto); } }, true);
function cleanupDay() { var fn = DB.fns[view.id]; if (fn && fn.days[view.date] && !fn.days[view.date].type) { delete fn.days[view.date]; save(); } }

/* ---------- start ---------- */
load();
view.fy = fyOf(today()); view.q = qOf(today());
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
